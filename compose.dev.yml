services:
  postgres:
    image: postgres:16-alpine
    container_name: flashlearn-postgres-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flashlearn
    volumes:
      - flashlearn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flashlearn"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  flashlearn_pgdata:
